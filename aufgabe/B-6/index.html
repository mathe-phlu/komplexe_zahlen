<h2 class="etappentitel"><span class="stand">Aufgabe B.6</span></h2><div class="aufgabenblatt"><p>Zeigen Sie, dass die Gleichung
  $z\overline{z}+\overline{b}z+b\overline{z}+q=0$ für $|b|^2 \ge q$ den 
  Kreis mit Mittelpunkt $-b$ und $r=\sqrt{|b|^2-q}$ beschreibt. <aside class="merksatz"><span class="kapitaelchen»Tipp:</span>
  Durchlaufen Sie die Herleitung von B.7 in der
  umgekehrten Richtung.</aside></p></div>
</main>
